workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - validate
  - test
  - dependency-scan
  - sonarqube
  - build
  # - docker-build-push

variables:
  NODE_VERSION: "20"
  GIT_DEPTH: "0"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key: "${CI_PROJECT_NAME}-npm"
  policy: pull-push
  paths:
    - .npm/

.node-job:
  image: node:20-bookworm
  before_script:
    - node --version
    - npm --version
    - npm ci

validate-frontend:
  stage: validate
  extends: .node-job
  script:
    - npm run lint --if-present
    - npm run format:check --if-present

test-frontend:
  stage: test
  extends: .node-job
  before_script:
    - apt-get update
    - apt-get install -y chromium
    - export CHROME_BIN=/usr/bin/chromium
    - node --version
    - npm --version
    - npm ci
  script:
    - echo "Cleaning previous coverage output"
    - rm -rf coverage
    - echo "Running Angular tests with LCOV coverage enabled"
    - npm run test:ci
    - echo "Coverage output after tests:"
    - ls -la coverage
    - echo "Verifying normalized LCOV report at coverage/lcov.info"
    - test -f coverage/lcov.info
    - ls -la coverage/lcov.info
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/

dependency-scan-trivy:
  stage: dependency-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: "${CI_PROJECT_NAME}-trivy"
    policy: pull-push
    paths:
      - .trivycache/
  before_script:
    - mkdir -p target/trivy
    - trivy --version
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --format table --output target/trivy/dependency-scan.txt .
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/trivy/

sonarqube-analysis:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_PROJECT_NAME}-sonar"
    policy: pull-push
    paths:
      - .sonar/cache
  dependencies:
    - test-frontend
  script:
    - |
      echo "Checking coverage artifact downloaded from test-frontend"
      ls -la

      if [ ! -d coverage ]; then
        echo "ERROR: coverage directory was not downloaded from test-frontend artifacts."
        exit 1
      fi

      echo "Coverage directory contents:"
      ls -la coverage

      if [ ! -f coverage/lcov.info ]; then
        echo "ERROR: coverage/lcov.info is missing. Failing before SonarCloud so analysis does not run without coverage."
        exit 1
      fi

      echo "Using coverage report: coverage/lcov.info"
      ls -la coverage/lcov.info

      sonar-scanner \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
        -Dsonar.organization="$SONAR_ORGANIZATION" \
        -Dsonar.sources=src \
        -Dsonar.tests=src \
        -Dsonar.test.inclusions="**/*.spec.ts" \
        -Dsonar.exclusions="src/assets/**,**/node_modules/**,**/dist/**" \
        -Dsonar.coverage.exclusions="src/main.ts,src/environments/**,src/**/*.model.ts,src/**/*.routes.ts,src/app/app.config.ts" \
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.qualitygate.wait=true

build-frontend:
  stage: build
  extends: .node-job
  script:
    - npm run build -- --configuration production
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

