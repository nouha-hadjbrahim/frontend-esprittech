workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never

stages:
  - validate
  - test
  - coverage
  - dependency-scan
  - secret-scan
  - sonarqube
  - build
  - docker-build
  - image-scan
  - publish
  - trigger-deployment

variables:
  NODE_VERSION: "20.19.6"
  GIT_DEPTH: "0"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  TRIVY_NO_PROGRESS: "true"
  IMAGE_OCI_ARCHIVE: "image.oci.tar"
  IMAGE_METADATA: "image.env"
  BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"

default:
  interruptible: true

cache:
  key: "${CI_PROJECT_NAME}-npm"
  policy: pull-push
  paths:
    - .npm/

.node-job:
  image: node:20.19.6-bookworm
  before_script:
    - node --version
    - npm --version
    - npm ci

.buildkit-job:
  image:
    name: moby/buildkit:v0.15.2-rootless
    entrypoint: [""]
  before_script:
    - mkdir -p "$HOME/.docker"
    - umask 077
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > "$HOME/.docker/config.json"

.skopeo-job:
  image:
    name: quay.io/skopeo/stable:v1.15.2
    entrypoint: [""]
  before_script:
    - mkdir -p "$HOME/.docker"
    - umask 077
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > "$HOME/.docker/config.json"

.trivy-job:
  image:
    name: aquasec/trivy:0.54.1
    entrypoint: [""]
  cache:
    key: "${CI_PROJECT_NAME}-trivy"
    policy: pull-push
    paths:
      - .trivycache/

validate-frontend:
  stage: validate
  extends: .node-job
  script:
    - |
      node -e "const pkg=require('./package.json'); if(!pkg.scripts || !pkg.scripts['test:ci']) throw new Error('Missing test:ci script'); console.log('test:ci script present')"
    - |
      node -e "const pkg=require('./package.json'); if(!pkg.scripts?.lint){ console.log('lint script is not configured; lint is explicitly not executed.'); process.exit(0) }"
    - |
      if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then npm run lint; fi
    - |
      node -e "const pkg=require('./package.json'); if(!pkg.scripts?.['format:check']){ console.log('format:check script is not configured; formatting check is explicitly not executed.'); process.exit(0) }"
    - |
      if node -e "process.exit(require('./package.json').scripts?.['format:check'] ? 0 : 1)"; then npm run format:check; fi

test-frontend:
  stage: test
  image: node:20.19.6-bookworm
  cache:
    key: "${CI_PROJECT_NAME}-npm"
    policy: pull-push
    paths:
      - .npm/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends chromium
    - export CHROME_BIN=/usr/bin/chromium
    - node --version
    - npm --version
    - npm ci
  script:
    - rm -rf coverage
    - npm run test:ci
    - LCOV_PATH="$(find coverage -type f -name lcov.info -print -quit)"
    - test -n "$LCOV_PATH"
    - mkdir -p coverage
    - if [ "$LCOV_PATH" != "coverage/lcov.info" ]; then cp "$LCOV_PATH" coverage/lcov.info; fi
    - test -f coverage/lcov.info
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/

coverage-report:
  stage: coverage
  extends: .node-job
  needs:
    - job: test-frontend
      artifacts: true
  script:
    - test -f coverage/lcov.info
    - |
      node <<'JS'
      const fs = require('fs');
      const lcov = fs.readFileSync('coverage/lcov.info', 'utf8');
      let found = false;
      for (const line of lcov.split(/\r?\n/)) {
        if (line.startsWith('LF:')) found = true;
      }
      if (!found) throw new Error('coverage/lcov.info has no LF records');
      console.log('LCOV report verified at coverage/lcov.info');
      JS
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/lcov.info

dependency-scan-trivy:
  stage: dependency-scan
  extends: .trivy-job
  script:
    - mkdir -p target/trivy
    - trivy --version
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --format table --output target/trivy/dependency-scan.txt .
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/trivy/dependency-scan.txt

secret-scan-trivy:
  stage: secret-scan
  extends: .trivy-job
  script:
    - mkdir -p target/trivy
    - trivy --version
    - trivy fs --scanners secret --format table --output target/trivy/secret-scan.txt --exit-code 1 .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/trivy/secret-scan.txt

sonarqube-analysis:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    entrypoint: [""]
  needs:
    - job: test-frontend
      artifacts: true
    - job: coverage-report
      artifacts: true
  cache:
    key: "${CI_PROJECT_NAME}-sonar"
    policy: pull-push
    paths:
      - .sonar/cache/
  script:
    - |
      for variable_name in SONAR_HOST_URL SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION; do
        eval "variable_value=\${$variable_name:-}"
        if [ -z "$variable_value" ]; then
          echo "$variable_name is not configured. Add it as a protected masked GitLab CI/CD variable."
          exit 1
        fi
      done
    - test -f coverage/lcov.info
    - >
      sonar-scanner
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.organization="$SONAR_ORGANIZATION"
      -Dsonar.sources=src
      -Dsonar.tests=src
      -Dsonar.test.inclusions="**/*.spec.ts"
      -Dsonar.exclusions="src/assets/**,**/*.html,**/*.css,**/*.scss,**/node_modules/**,**/dist/**"
      -Dsonar.coverage.exclusions="src/main.ts,src/environments/**,src/**/*.model.ts,src/**/*.routes.ts,src/app/app.config.ts"
      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      -Dsonar.qualitygate.wait=true

build-frontend:
  stage: build
  extends: .node-job
  script:
    - npm run build -- --configuration production
    - test -f dist/esprittech-frontend/browser/index.html
    - |
      node <<'JS'
      const fs = require('fs');
      const environment = fs.readFileSync('src/environments/environment.ts', 'utf8');
      if (!environment.includes("apiUrl: '/api'")) {
        throw new Error('production environment must use relative /api');
      }
      JS
    - if grep -R -I -l -E 'https?://(localhost|127\.0\.0\.1|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)' dist/esprittech-frontend src/environments/environment.ts; then exit 1; fi
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

docker-build-oci:
  stage: docker-build
  extends: .buildkit-job
  needs:
    - job: build-frontend
      artifacts: true
  script:
    - test -f dist/esprittech-frontend/browser/index.html
    - rm -f "$IMAGE_OCI_ARCHIVE"
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR"
      --opt filename=Dockerfile
      --output "type=oci,dest=$IMAGE_OCI_ARCHIVE,name=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - test -s "$IMAGE_OCI_ARCHIVE"
  artifacts:
    expire_in: 1 day
    paths:
      - image.oci.tar

image-scan-trivy:
  stage: image-scan
  extends: .trivy-job
  needs:
    - job: docker-build-oci
      artifacts: true
  script:
    - test -s "$IMAGE_OCI_ARCHIVE"
    - rm -rf image.oci
    - mkdir -p target/trivy image.oci
    - tar -xf "$IMAGE_OCI_ARCHIVE" -C image.oci
    - test -f image.oci/index.json
    - trivy image --input image.oci --severity HIGH,CRITICAL --format table --output target/trivy/image-scan.txt
    - trivy image --input image.oci --severity HIGH,CRITICAL --exit-code 1
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/trivy/image-scan.txt

publish-image:
  stage: publish
  extends: .skopeo-job
  needs:
    - job: docker-build-oci
      artifacts: true
    - job: image-scan-trivy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never
  script:
    - test -s "$IMAGE_OCI_ARCHIVE"
    - skopeo copy --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "oci-archive:$IMAGE_OCI_ARCHIVE" "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - skopeo copy --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "oci-archive:$IMAGE_OCI_ARCHIVE" "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        case "$CI_COMMIT_TAG" in
          v*) skopeo copy --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "oci-archive:$IMAGE_OCI_ARCHIVE" "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" ;;
        esac
      fi
    - IMAGE_DIGEST="$(skopeo inspect --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" --format '{{.Digest}}' "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA")"
    - |
      {
        echo "IMAGE_REPOSITORY=$CI_REGISTRY_IMAGE"
        echo "IMAGE_TAG=$CI_COMMIT_SHA"
        echo "IMAGE_DIGEST=$IMAGE_DIGEST"
        echo "SOURCE_COMMIT_SHA=$CI_COMMIT_SHA"
        echo "SOURCE_PROJECT_PATH=$CI_PROJECT_PATH"
      } > "$IMAGE_METADATA"
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: image.env
    paths:
      - image.env

trigger-deployment:
  stage: trigger-deployment
  needs:
    - job: publish-image
      artifacts: true
  resource_group: deployment-trigger
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never
  trigger:
    project: mokaddemkarim89/deployment_industproject
    branch: main
    strategy: mirror
  variables:
    CHANGED_COMPONENT: "frontend"
    CHANGED_IMAGE_REPOSITORY: "$CI_REGISTRY_IMAGE"
    CHANGED_IMAGE_TAG: "$CI_COMMIT_SHA"
    SOURCE_PROJECT_PATH: "$CI_PROJECT_PATH"
    SOURCE_COMMIT_SHA: "$CI_COMMIT_SHA"
    SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
