workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - validate
  - test
  - dependency-scan
  - sonarqube
  - build
  # - docker-build-push

variables:
  NODE_VERSION: "20"
  GIT_DEPTH: "0"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key: "${CI_PROJECT_NAME}-npm"
  policy: pull-push
  paths:
    - .npm/

.node-job:
  image: node:20-bookworm
  before_script:
    - node --version
    - npm --version
    - npm ci

validate-frontend:
  stage: validate
  extends: .node-job
  script:
    - npm run lint --if-present
    - npm run format:check --if-present

test-frontend:
  stage: test
  extends: .node-job
  before_script:
    - apt-get update
    - apt-get install -y chromium
    - export CHROME_BIN=/usr/bin/chromium
    - node --version
    - npm --version
    - npm ci
  script:
    - npm run test -- --watch=false --browsers=ChromeHeadless --no-progress --code-coverage
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/

dependency-scan-trivy:
  stage: dependency-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: "${CI_PROJECT_NAME}-trivy"
    policy: pull-push
    paths:
      - .trivycache/
  before_script:
    - mkdir -p target/trivy
    - trivy --version
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --format table --output target/trivy/dependency-scan.txt .
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/trivy/

sonarqube-analysis:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_PROJECT_NAME}-sonar"
    policy: pull-push
    paths:
      - .sonar/cache
  dependencies:
    - test-frontend
  script:
    - |
      LCOV_FILE=$(find coverage -name lcov.info | head -n 1 || true)

      if [ -n "$LCOV_FILE" ]; then
        echo "Using coverage report: $LCOV_FILE"
        sonar-scanner \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
          -Dsonar.organization="$SONAR_ORGANIZATION" \
          -Dsonar.sources=src \
          -Dsonar.tests=src \
          -Dsonar.test.inclusions="**/*.spec.ts" \
          -Dsonar.exclusions="**/node_modules/**,**/dist/**" \
          -Dsonar.javascript.lcov.reportPaths="$LCOV_FILE" \
          -Dsonar.qualitygate.wait=true
      else
        echo "No lcov.info found. Running SonarCloud without coverage."
        sonar-scanner \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
          -Dsonar.organization="$SONAR_ORGANIZATION" \
          -Dsonar.sources=src \
          -Dsonar.tests=src \
          -Dsonar.test.inclusions="**/*.spec.ts" \
          -Dsonar.exclusions="**/node_modules/**,**/dist/**" \
          -Dsonar.qualitygate.wait=true
      fi

build-frontend:
  stage: build
  extends: .node-job
  script:
    - npm run build -- --configuration production
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

