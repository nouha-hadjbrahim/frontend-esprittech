<div class="profile-page">
  <div class="page-header">
    <div class="header-text">
      <h1>Mon profil</h1>
      <p>Consultez et mettez à jour vos informations personnelles et votre mot de passe.</p>
    </div>
  </div>

  <section class="profile-hero" aria-label="Identité">
    <div class="profile-hero__glow" aria-hidden="true"></div>
    <div class="avatar-wrap">
      <div class="avatar">{{ initials() }}</div>
      <button type="button" class="camera-btn" title="Changer la photo" aria-label="Changer la photo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </button>
    </div>
    <div class="profile-hero__info">
      <h2>{{ user()?.prenom }} {{ user()?.nom }}</h2>
      <span class="role-badge" [class]="roleBadgeClass()">{{ roleLabel() }}</span>
      @if (user()?.email) {
        <p class="profile-hero__email">{{ user()?.email }}</p>
      }
    </div>
  </section>

  <section class="content-card">
    <header class="card-header">
      <span class="card-header__icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </span>
      <div>
        <span class="card-header__kicker">Identité</span>
        <h3 class="card-header__title">Informations personnelles</h3>
      </div>
    </header>

    <div class="form-grid">
      <div class="form-group">
        <label for="profile-fullname">Nom complet</label>
        <input id="profile-fullname" type="text" [(ngModel)]="profileData.fullName" placeholder="Admin EspritTECH">
      </div>
      <div class="form-group">
        <label for="profile-email">Email</label>
        <input id="profile-email" type="email" [(ngModel)]="profileData.email" placeholder="admin@esprit.tn">
      </div>
      <div class="form-group">
        <label for="profile-phone">Téléphone</label>
        <input id="profile-phone" type="text" [(ngModel)]="profileData.phone" placeholder="+216 71 000 000">
      </div>
      <div class="form-group">
        <label for="profile-role">Rôle</label>
        <input id="profile-role" type="text" [value]="roleLabel()" readonly class="readonly-input">
      </div>
      <div class="form-group full-width">
        <label for="profile-department">Département</label>
        <input id="profile-department" type="text" [(ngModel)]="profileData.department" placeholder="RDI — Direction">
      </div>
    </div>
  </section>

  <section class="content-card">
    <header class="card-header">
      <span class="card-header__icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </span>
      <div>
        <span class="card-header__kicker">Sécurité</span>
        <h3 class="card-header__title">Modifier le mot de passe</h3>
      </div>
    </header>

    <div class="form-grid">
      <div class="form-group">
        <label for="profile-current-password">Mot de passe actuel</label>
        <input id="profile-current-password" type="password" [(ngModel)]="passwordData.current" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label for="profile-new-password">Nouveau mot de passe</label>
        <input id="profile-new-password" type="password" [(ngModel)]="passwordData.new" placeholder="••••••••">
      </div>
    </div>
  </section>
</div>
