<div class="projects-page">
    <div class="page-header">
        <div class="header-text">
            <h1>Mes projets</h1>
            <p>Projets que vous avez encadrés et leur statut au catalogue.</p>
        </div>

        <button class="add-btn-unique" (click)="openModal()">
            <span class="handwritten-text">Ajouter +</span>
        </button>
    </div>

    <!-- Filters Section (Mock) -->
    <div class="filters-container">
        <div class="search-field">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="Rechercher un projet...">
        </div>
        <div class="filters-group">
            <div class="filter-dropdown">
                <span>Type</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m6 9 6 6 6-6"></path>
                </svg>
            </div>
            <div class="filter-dropdown">
                <span>Statut</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m6 9 6 6 6-6"></path>
                </svg>
            </div>
            <div class="filter-dropdown sort-dropdown">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="20" x2="12" y2="10"></line>
                    <line x1="18" y1="20" x2="18" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="16"></line>
                </svg>
                <span>Plus récents</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m6 9 6 6 6-6"></path>
                </svg>
            </div>
        </div>
    </div>

    <!-- Grid of Projects -->
    <div class="projects-grid">
        <div class="project-card" *ngFor="let proj of projects">
            <div class="card-cover" [style.background-image]="'url(' + proj.cover + ')'">
                <div class="status-pill" [style.background-color]="proj.statusColor + '22'"
                    [style.color]="proj.statusColor">
                    {{ proj.status }}
                </div>
            </div>
            <div class="card-body">
                <div class="card-header-row">
                    <h3 class="proj-title">{{ proj.title }}</h3>
                    <div class="score-display">
                        <span class="score-value">{{ proj.score }}</span><span class="score-max">/100</span>
                    </div>
                </div>
                <p class="proj-meta">{{ proj.type }} • {{ proj.year }} • {{ proj.supervisors }}</p>
                <div class="card-actions">
                    <button class="action-btn" routerLink="/backoffice/project-details">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        Voir détails
                    </button>
                    <!-- Per user request: no 'modifier les livrables' button here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Project Modal -->
    <div class="modal-overlay" *ngIf="isModalOpen" (click)="closeModal()">
        <div class="modal-content large-modal" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title-group">
                    <h2>Déposer un sujet</h2>
                    <p>Encadrant : Admin EspritTECH (Mock)</p>
                </div>
                <button class="close-btn" (click)="closeModal()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <form class="modal-form-grid" (submit)="submitProject()">
                <div class="type-selector">
                    <button type="button" class="type-btn" [class.active]="newProject.type === 'Stage'"
                        (click)="setProjectType('Stage')">Stage</button>
                    <button type="button" class="type-btn" [class.active]="newProject.type === 'PFE'"
                        (click)="setProjectType('PFE')">PFE</button>
                    <button type="button" class="type-btn" [class.active]="newProject.type === 'RDI'"
                        (click)="setProjectType('RDI')">RDI</button>
                </div>

                <div class="form-columns">
                    <!-- Left Column -->
                    <div class="form-col left-col">
                        <div class="form-group">
                            <label>Titre</label>
                            <input type="text" name="title" [(ngModel)]="newProject.title" placeholder="Titre du sujet"
                                required>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea name="description" [(ngModel)]="newProject.description" rows="4"
                                placeholder="Décrivez le sujet..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Objectifs</label>
                            <textarea name="objectives" [(ngModel)]="newProject.objectives" rows="4"
                                placeholder="Objectifs du projet..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Prérequis</label>
                            <div class="input-with-btn">
                                <input type="text" name="customPrerequisite" [(ngModel)]="customPrerequisite"
                                    placeholder="Ajouter un prérequis...">
                                <button type="button" class="inline-add-btn"
                                    (click)="addCustomItem(prerequisitesList, 'customPrerequisite')">Ajouter</button>
                            </div>
                            <div class="checkbox-list">
                                <label class="checkbox-item" *ngFor="let item of prerequisitesList; let i = index">
                                    <input type="checkbox" name="prereq-{{i}}" [(ngModel)]="item.selected">
                                    <span>{{ item.name }}</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="form-col right-col">
                        <div class="form-group">
                            <label>Domaines</label>
                            <div class="input-with-btn">
                                <input type="text" name="customDomain" [(ngModel)]="customDomain"
                                    placeholder="Ajouter un domaines...">
                                <button type="button" class="inline-add-btn"
                                    (click)="addCustomItem(domainsList, 'customDomain')">Ajouter</button>
                            </div>
                            <div class="checkbox-list">
                                <label class="checkbox-item" *ngFor="let item of domainsList; let i = index">
                                    <input type="checkbox" name="domain-{{i}}" [(ngModel)]="item.selected">
                                    <span>{{ item.name }}</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Technologies</label>
                            <div class="input-with-btn">
                                <input type="text" name="customTech" [(ngModel)]="customTech"
                                    placeholder="Ajouter une technologie...">
                                <button type="button" class="inline-add-btn-primary"
                                    (click)="addCustomItem(technologiesList, 'customTech')">Ajouter</button>
                            </div>
                            <div class="checkbox-list two-cols">
                                <label class="checkbox-item" *ngFor="let item of technologiesList; let i = index">
                                    <input type="checkbox" name="tech-{{i}}" [(ngModel)]="item.selected">
                                    <span>{{ item.name }}</span>
                                </label>
                            </div>
                        </div>

                        <!-- Replaced capacity with dates per request -->
                        <div class="form-group dates-group">
                            <div>
                                <label>Date début du projet</label>
                                <input type="date" name="startDate" [(ngModel)]="newProject.startDate" required>
                            </div>
                            <div>
                                <label>Date fin du projet</label>
                                <input type="date" name="endDate" [(ngModel)]="newProject.endDate" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer-sticky">
                    <button type="button" class="cancel-btn" (click)="closeModal()">Annuler</button>
                    <button type="submit" class="submit-btn" [disabled]="!newProject.title">Soumettre le sujet</button>
                </div>
            </form>
        </div>
    </div>
</div>
