<div class="filter-dropdown" [class.filter-dropdown--open]="isOpen">
  <button
    type="button"
    class="filter-dropdown__trigger"
    [class.filter-dropdown__trigger--active]="isActive"
    [class.filter-dropdown__trigger--open]="isOpen"
    (click)="toggle($event)"
  >
    @if (showSortIcon) {
      <svg class="filter-dropdown__sort-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M3.5 2V12M3.5 2L1.5 4M3.5 2L5.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10.5 12V2M10.5 12L8.5 10M10.5 12L12.5 10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    }
    <span>{{ displayLabel }}</span>
    <svg class="filter-dropdown__chevron" [class.filter-dropdown__chevron--open]="isOpen" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
      <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  @if (isOpen) {
    <ul class="filter-dropdown__menu">
      @for (option of options; track option.value) {
        <li>
          <button
            type="button"
            class="filter-dropdown__option"
            [class.filter-dropdown__option--active]="value === option.value"
            (click)="select(option, $event)"
          >
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
