<article class="sujet-list-row">
  <div class="sujet-list-row__accent" [class]="accentClass" aria-hidden="true"></div>

  <div class="sujet-list-row__icon" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
      <path d="M6 2.5H12L15.5 6V16.5C15.5 17.05 15.05 17.5 14.5 17.5H5.5C4.95 17.5 4.5 17.05 4.5 16.5V3.5C4.5 2.95 4.95 2.5 5.5 2.5H6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M12 2.5V6H15.5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M7.5 10H12.5M7.5 13H11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="sujet-list-row__content">
    <div class="sujet-list-row__tags">
      <span class="sujet-list-row__domain">{{ primaryDomaine }}</span>
      <span class="sujet-list-row__type">{{ categorieShortLabel }}</span>
      <span class="sujet-list-row__statut" [class]="statutListClass">
        <span class="sujet-list-row__statut-dot" [class]="statusDotClass" aria-hidden="true"></span>
        {{ statutBadge.label }}
      </span>
    </div>

    <h3 class="sujet-list-row__title">{{ sujet.titre }}</h3>
    <p class="sujet-list-row__description">{{ shortDescription }}</p>

    <div class="sujet-list-row__meta">
      <span class="sujet-list-row__avatar" aria-hidden="true">{{ initials }}</span>
      <span class="sujet-list-row__author">{{ sujet.encadrantNom || 'Encadrant' }}</span>
      <span class="sujet-list-row__meta-item">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="1.5" y="2.5" width="11" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M1.5 5.5H12.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4.5 1V3.5M9.5 1V3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        {{ formattedDate }}
      </span>
      <span class="sujet-list-row__meta-item sujet-list-row__meta-item--places">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <circle cx="5" cy="4.5" r="2" stroke="currentColor" stroke-width="1.2"/>
          <path d="M1 12.5C1 10 2.8 8.5 5 8.5C7.2 8.5 9 10 9 12.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="10.5" cy="4.5" r="1.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M13 12.5C13 10.8 11.8 9.5 10.5 9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        {{ placesLabel }}
      </span>
    </div>
  </div>

  <div class="sujet-list-row__actions">
    <a
      [routerLink]="['/frontoffice/sujets', sujet.id]"
      class="sujet-list-row__btn"
    >
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M1 7C1 7 3.5 2.5 7 2.5C10.5 2.5 13 7 13 7C13 7 10.5 11.5 7 11.5C3.5 11.5 1 7 1 7Z" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.2"/>
      </svg>
      Détails
    </a>

    @if (isOwner) {
      <button type="button" class="sujet-list-row__btn" (click)="onEdit($event)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M10 1.5L12.5 4L4.5 12H2V9.5L10 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
        Modifier
      </button>

      <button type="button" class="sujet-list-row__btn" (click)="onDelete($event)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M2 4H12M5 4V2.5H9V4M5.5 6V10M8.5 6V10M3.5 4L4 11.5H10L10.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Supprimer
      </button>
    }

    @if (isOwner && showCandidaturesAction) {
      <button
        type="button"
        class="sujet-list-row__btn sujet-list-row__btn--primary"
        (click)="onGererCandidatures($event)"
      >
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <circle cx="5" cy="4.5" r="2" stroke="currentColor" stroke-width="1.2"/>
          <path d="M1 12.5C1 10 2.8 8.5 5 8.5C7.2 8.5 9 10 9 12.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="10.5" cy="4.5" r="1.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M13 12.5C13 10.8 11.8 9.5 10.5 9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Candidatures
      </button>
    }
  </div>
</article>
