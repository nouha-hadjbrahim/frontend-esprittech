<div class="editable-options">
  <label class="editable-options__label">{{ label }}</label>

  @if (allowRemove && options.length > 0) {
    <div class="editable-options__chips">
      @for (option of options; track option) {
        <span class="editable-options__chip">
          {{ option }}
          <button
            type="button"
            class="editable-options__chip-remove"
            [attr.aria-label]="'Supprimer ' + option"
            (click)="removeOption(option, $event)"
          >
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3 3L9 9M9 3L3 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </span>
      }
    </div>
  }

  <div class="editable-options__add">
    <input
      type="text"
      class="editable-options__input"
      [(ngModel)]="newOption"
      [placeholder]="'Ajouter un ' + label.toLowerCase() + '...'"
      (keydown)="onAddKeydown($event)"
    />
    <button type="button" class="editable-options__add-btn" (click)="addOption()">Ajouter</button>
  </div>

  @if (options.length > 0) {
    <div class="editable-options__list">
      @for (option of options; track option) {
        <label class="editable-options__item">
          <input
            type="checkbox"
            [checked]="isSelected(option)"
            (change)="toggleOption(option)"
          />
          <span>{{ option }}</span>
        </label>
      }
    </div>
  } @else {
    <p class="editable-options__empty">Aucune option disponible. Ajoutez-en une ci-dessus.</p>
  }
</div>
