<div class="frontoffice-container">
    <!-- Header / Navbar -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <img src="assets/logo.png" alt="EspriTECH Logo" style="height: 40px;" />
            </div>

            <!-- Dynamic Navigation Based on Role -->
            <nav class="navigation">
                <ng-container *ngFor="let link of navLinks()">
                    <!-- Dropdown for links with children -->
                    <div class="nav-item-dropdown" *ngIf="link.children; else singleLink">
                        <button class="nav-link dropdown-toggle">
                            {{ link.label }}
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div class="dropdown-menu">
                            <a *ngFor="let child of link.children" [routerLink]="child.path" routerLinkActive="active"
                                class="dropdown-item">
                                @if (child.icon === 'layers') {
                                    <svg class="dropdown-item__icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                                        <path d="M9 1.5L2.25 5.25L9 9L15.75 5.25L9 1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                                        <path d="M2.25 9L9 12.75L15.75 9" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                                        <path d="M2.25 12.75L9 16.5L15.75 12.75" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                                    </svg>
                                } @else if (child.icon === 'document') {
                                    <svg class="dropdown-item__icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                                        <path d="M4.5 2.25H10.5L13.5 5.25V15.75C13.5 16.1642 13.1642 16.5 12.75 16.5H4.5C4.08579 16.5 3.75 16.1642 3.75 15.75V3C3.75 2.58579 4.08579 2.25 4.5 2.25Z" stroke="currentColor" stroke-width="1.3"/>
                                        <path d="M10.5 2.25V5.25H13.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                                        <path d="M6 8.25H10.5M6 10.5H10.5M6 12.75H9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                                    </svg>
                                } @else if (child.icon === 'validation') {
                                    <svg class="dropdown-item__icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                                        <path d="M4.5 2.25H10.5L13.5 5.25V15.75C13.5 16.1642 13.1642 16.5 12.75 16.5H4.5C4.08579 16.5 3.75 16.1642 3.75 15.75V3C3.75 2.58579 4.08579 2.25 4.5 2.25Z" stroke="currentColor" stroke-width="1.3"/>
                                        <path d="M10.5 2.25V5.25H13.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                                        <path d="M6.75 10.5L8.25 12L11.25 8.25" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                }
                                <span>{{ child.label }}</span>
                                @if (child.label === "Demandes d'affiliation" && pendingDemandesCount() > 0) {
                                  <span class="nav-badge">{{ pendingDemandesCount() }}</span>
                                }
                            </a>
                        </div>
                    </div>
                    <!-- Single Link -->
                    <ng-template #singleLink>
                        <a [routerLink]="link.path" routerLinkActive="active" class="nav-link">
                            {{ link.label }}
                        </a>
                    </ng-template>
                </ng-container>
            </nav>
        </div>

        <div class="header-right">
            <app-notification-bell />

            <div class="profile-dropdown">
                <button class="profile-toggle" (click)="toggleProfileDropdown()">
                    <img src="assets/images/avatar.jpg" alt="Profile" class="avatar"
                        onerror="this.src='https://ui-avatars.com/api/?name=User&background=random'" />
                    <div class="profile-info">
                        <span class="profile-name">{{ user() ? user()!.prenom + ' ' + user()!.nom : 'Utilisateur'
                            }}</span>
                        <span class="profile-role">{{ roleLabel() }}</span>
                    </div>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>

                <div class="dropdown-menu" [class.show]="isProfileDropdownOpen()">
                    <a class="dropdown-item" routerLink="/frontoffice/profil" (click)="isProfileDropdownOpen.set(false)">Mon profil</a>
                    <button class="dropdown-item logout-btn" (click)="logout()">Déconnexion</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Page Content -->
    <main class="main-content">
        <router-outlet></router-outlet>
    </main>
</div>
