@if (isOpen) {
  <div class="confirm-overlay" (click)="onOverlayClick($event)">
    <div class="confirm-dialog" [class.confirm-dialog--no-icon]="!showIcon" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      @if (showIcon) {
        <div class="confirm-dialog__icon" [class.confirm-dialog__icon--alert]="alertOnly">
          @if (alertOnly) {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
              <path d="M12 8V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="12" cy="16" r="0.75" fill="currentColor"/>
            </svg>
          } @else {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 6H5H21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M8 6V4.5C8 3.67 8.67 3 9.5 3H14.5C15.33 3 16 3.67 16 4.5V6" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10 11V17M14 11V17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M6 6L7 19.5C7 20.33 7.67 21 8.5 21H15.5C16.33 21 17 20.33 17 19.5L18 6" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          }
        </div>
      }

      <h3 class="confirm-dialog__title">{{ title }}</h3>
      <p class="confirm-dialog__message">{{ message }}</p>

      @if (errorMessage) {
        <p class="confirm-dialog__error">{{ errorMessage }}</p>
      }

      <div class="confirm-dialog__actions">
        @if (!alertOnly) {
          <button type="button" class="confirm-dialog__btn confirm-dialog__btn--cancel" [disabled]="loading" (click)="cancel()">
            {{ cancelLabel }}
          </button>
        }
        <button
          type="button"
          class="confirm-dialog__btn"
          [class.confirm-dialog__btn--confirm]="!alertOnly"
          [class.confirm-dialog__btn--close]="alertOnly"
          [disabled]="loading"
          (click)="alertOnly ? cancel() : confirm()"
        >
          {{ alertOnly ? 'Fermer' : (loading ? 'Traitement…' : confirmLabel) }}
        </button>
      </div>
    </div>
  </div>
}
