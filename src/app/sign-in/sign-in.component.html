<div class="auth-page">
    <div class="auth-background">
        <div class="dot-pattern"></div>
        <div class="glow-container">
            <div class="glow-layer glow-1"></div>
            <div class="glow-layer glow-2"></div>
            <div class="glow-layer glow-3"></div>
        </div>
    </div>

    <div class="auth-card">
        <div class="logo-container">
            <div class="logo">E</div>
            <p class="brand">EspriTECH</p>
        </div>

        <form (ngSubmit)="onSubmit()" #signInForm="ngForm">
            <h1 class="auth-title">Connexion</h1>
            <p class="auth-subtitle">Accédez à votre espace EspriTECH.</p>

            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" ngModel required placeholder=" ">
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="password">Mot de passe</label>
                    <a href="#" class="forgot-link">Mot de passe oublié ?</a>
                </div>
                <input type="password" id="password" name="password" ngModel required placeholder=" ">
            </div>

            <div class="form-group">
                <label for="userType">Se connecter en tant que (démo)</label>
                <select id="userType" name="userType" [(ngModel)]="userType">
                    <option value="Enseignant">Enseignant</option>
                    <option value="Etudiant">Etudiant</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" [disabled]="signInForm.invalid">Se connecter</button>

            <p class="auth-footer">
                Pas encore de compte ? <a routerLink="/sign-up">Créer un compte</a>
            </p>
        </form>
    </div>
</div>
