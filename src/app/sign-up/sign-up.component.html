<div class="auth-page">
    <div class="auth-background">
        <div class="dot-pattern"></div>
        <div class="glow-container">
            <div class="glow-layer glow-1"></div>
            <div class="glow-layer glow-2"></div>
            <div class="glow-layer glow-3"></div>
        </div>
    </div>

    <div class="auth-card">
        <div class="logo-container">
            <div class="logo">E</div>
            <p class="brand">EspriTECH</p>
        </div>

        <form (ngSubmit)="onSubmit()" #signUpForm="ngForm">
            <h1 class="auth-title">Créer un compte</h1>
            <p class="auth-subtitle">Rejoignez la plateforme EspriTECH.</p>

            <div class="row">
                <div class="form-group flex-1">
                    <label for="firstName">Prénom</label>
                    <input type="text" id="firstName" name="firstName" ngModel required placeholder=" ">
                </div>
                <div class="form-group flex-1">
                    <label for="lastName">Nom</label>
                    <input type="text" id="lastName" name="lastName" ngModel required placeholder=" ">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" ngModel required placeholder=" ">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" ngModel required placeholder=" ">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" name="confirmPassword" ngModel required placeholder=" ">
            </div>

            <button type="submit" class="submit-btn" [disabled]="signUpForm.invalid">Créer mon compte</button>

            <p class="auth-footer">
                Déjà inscrit ? <a routerLink="/sign-in">Se connecter</a>
            </p>
        </form>
    </div>
</div>
